name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: cd-juli-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/juli-public
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Build & push the storefront image. The Dockerfile at repo root produces
  # the Angular SSR bundle + server.js. Strapi (juli/strapi/) ships its own
  # image and is deployed independently — this workflow does not touch it.
  # ---------------------------------------------------------------------------
  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.environment || 'staging' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=juli-public
          cache-to: type=gha,mode=max,scope=juli-public

  # ---------------------------------------------------------------------------
  # Deploy to staging — juli-public ships from the ubris monorepo's
  # infra/docker-compose.yml on the host. SSH pulls the new tag and bounces
  # the service in place; the rest of the suite is left untouched (--no-deps).
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to staging
    needs: docker
    if: github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_STOREFRONT_URL }}
    steps:
      - name: Compute image tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_tag=sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Deploy via docker-compose (SSH)
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          IMAGE_TAG: ${{ steps.tags.outputs.sha_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOST:-}" ]]; then
            echo "::warning::STAGING_DEPLOY_HOST not configured -- skipping remote deploy"
            echo "Would deploy: ${IMAGE}:${IMAGE_TAG}"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key"

          ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<REMOTE_SCRIPT
            set -euo pipefail
            cd /opt/ubris/infra || cd ~/ubris/infra

            export IMAGE_TAG="${IMAGE_TAG}"
            export REGISTRY="${REGISTRY}"

            docker pull "${IMAGE}:${IMAGE_TAG}"
            # --no-deps to avoid cascading restarts on suite peers (the host
            # convention everywhere else in this stack — see CLAUDE memory
            # 'docker compose up em prod precisa --no-deps').
            docker compose up -d --no-build --no-deps juli-public

            echo "Staging deploy complete: juli-public at ${IMAGE_TAG}"
          REMOTE_SCRIPT

      - name: Post-deploy health check
        env:
          STAGING_URL: ${{ vars.STAGING_STOREFRONT_URL }}
        run: |
          if [[ -z "${STAGING_URL:-}" ]]; then
            echo "::warning::STAGING_STOREFRONT_URL not configured -- skipping health check"
            exit 0
          fi
          echo "Waiting for storefront SSR to come up..."
          sleep 10
          for i in 1 2 3 4 5; do
            HTTP=$(curl -sfk -o /dev/null -w '%{http_code}' "${STAGING_URL}/" 2>/dev/null || echo "000")
            echo "Attempt ${i}: HTTP ${HTTP}"
            if [[ "$HTTP" =~ ^(200|302)$ ]]; then
              echo "Staging storefront is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Storefront did not return 200/302 after 5 attempts"

  # ---------------------------------------------------------------------------
  # Deploy to production
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to production
    needs: docker
    if: github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_STOREFRONT_URL }}
    steps:
      - name: Compute image tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_tag=sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Deploy via docker-compose (SSH)
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          IMAGE_TAG: ${{ steps.tags.outputs.sha_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOST:-}" ]]; then
            echo "::error::PRODUCTION_DEPLOY_HOST not configured -- cannot deploy"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key"

          ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<REMOTE_SCRIPT
            set -euo pipefail
            cd /opt/ubris/infra || cd ~/ubris/infra

            export IMAGE_TAG="${IMAGE_TAG}"
            export REGISTRY="${REGISTRY}"

            docker pull "${IMAGE}:${IMAGE_TAG}"
            docker compose up -d --no-build --no-deps juli-public

            echo "Production deploy complete: juli-public at ${IMAGE_TAG}"
          REMOTE_SCRIPT

      - name: Post-deploy health check
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_STOREFRONT_URL }}
        run: |
          if [[ -z "${PRODUCTION_URL:-}" ]]; then
            echo "::warning::PRODUCTION_STOREFRONT_URL not configured -- skipping health check"
            exit 0
          fi
          echo "Waiting for storefront SSR..."
          sleep 15
          for i in 1 2 3 4 5 6 7 8; do
            HTTP=$(curl -sfk -o /dev/null -w '%{http_code}' "${PRODUCTION_URL}/" 2>/dev/null || echo "000")
            echo "Attempt ${i}: HTTP ${HTTP}"
            if [[ "$HTTP" =~ ^(200|302)$ ]]; then
              echo "Production storefront is healthy"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Production storefront health check failed after 8 attempts"
          exit 1

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  summary:
    name: Deployment summary
    needs: [docker, deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          echo "## juli-public Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | \`${ENV}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${SHA_SHORT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image tag** | \`sha-${SHA_SHORT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Docker build** | ${{ needs.docker.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Staging deploy** | ${{ needs.deploy-staging.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Production deploy** | ${{ needs.deploy-production.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
